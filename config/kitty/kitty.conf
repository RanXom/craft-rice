# craft-rice — Kitty configuration
# The rice look: Monocraft, translucent, blurred, no scrollbar.
# The palette is generated by Noctalia into themes/noctalia.conf.

font_family Monocraft
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.5

cursor_shape beam
cursor_trail 60
cursor_trail_decay 0.2 0.4
cursor_trail_start_threshold 0
cursor_blink true

scrollbar_width 0
window_padding_width 10
window_padding_height 5
background_opacity 0.66
background_blur 1
confirm_os_window_close 0

# Neovim-style pane navigation.
map ctrl+shift+enter launch --location=vsplit
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right

# Noctalia rewrites this file on every palette change. The shipped copy is a
# fallback so Kitty always has a valid theme, even before Noctalia starts.
include themes/noctalia.conf
